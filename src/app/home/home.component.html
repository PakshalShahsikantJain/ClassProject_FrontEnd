<!-- Carousel Section -->
<div>
  <carousel [isAnimated]="true" [noPause]="true" [showIndicators]="false">
    @for (slide of slides; track slide) {
      <slide>
        <img [src]="slide.image" class="carousel-image" />
        <div class="carousel-caption">
          <h1>{{ slide.title }}</h1>
        </div>
      </slide>
    }
  </carousel>
</div>

<!-- Batches Section -->
<div>
  <div class="text">
    <h1>BATCHES</h1>
  </div>

  <div class="divider-container">
    <mat-divider class="custom-divider"></mat-divider>
  </div>

  <div class="cardDisplay container">
    @for (item of items; track item) {
      <div class="image-card">
        <img [src]="item.image" alt="Image" class="card-image" />
        <div class="card-button-group">
          @if (item.status === 'Active') {
            <button routerLink="/register" mat-raised-button color="primary" class="action-btn">
              Register
            </button>
          }
          @if (item.status !== 'Active') {
            <button mat-raised-button color="warn" class="action-btn">
              Registration Closed
            </button>
          }
          <button [routerLink]="['/details', item.title]" mat-raised-button color="accent" class="action-btn">
            View Details
          </button>
        </div>
      </div>
    }
  </div>
</div>

<!-- About Us Section -->
<div class="text2">
  <h1>ABOUT US</h1>
</div>

<div class="divider-container2">
  <mat-divider class="custom-divider2"></mat-divider>
</div>

<div class="container">
  <app-aboutus></app-aboutus>
</div>
